<body>
<h1>Usona's NDA for Psilocybin Approved</h1>
<button id="go">Tap to read the announcement</button>
<iframe id="v" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
<script>
var ID="XqZsoesa55w",START=68,left=false;
function gone(){left=true}
document.addEventListener("visibilitychange",function(){if(document.hidden)gone()});
window.addEventListener("pagehide",gone);
setTimeout(function(){window.location.href="youtube://www.youtube.com/watch?v="+ID+"&t="+START},1500);
setTimeout(function(){if(!left)document.getElementById("go").style.display="inline-block"},3500);
document.getElementById("go").onclick=function(){
  this.style.display="none";
  var f=document.getElementById("v");
  f.src="https://www.youtube.com/embed/"+ID+"?autoplay=1&start="+START+"&playsinline=1&rel=0";
  f.style.display="block";
};
</script>
